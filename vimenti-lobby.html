<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso — Vimenti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c;
    --panel:#161513;
    --panel-line: rgba(245,241,234,0.08);
    --orange:#f5a623;
    --orange-deep:#c97d1e;
    --cream:#f5f1ea;
    --white:#ffffff;
    --error:#e8654d;
    --muted: rgba(245,241,234,0.56);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--cream);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .scene{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:32px 20px;
  }

  /* ambient shard, echoes the mark's angular flag silhouette */
  .shard{
    position:absolute;
    top:-18%;
    right:-14%;
    width:62vmax;
    height:62vmax;
    background:radial-gradient(circle at 32% 30%, rgba(245,166,35,0.16), rgba(245,166,35,0) 62%);
    clip-path: polygon(58% 0%, 100% 30%, 92% 78%, 46% 100%, 10% 62%);
    filter: blur(2px);
    pointer-events:none;
  }

  .glow{
    position:absolute;
    left:50%;
    top:38%;
    transform:translate(-50%,-50%);
    width:520px;
    height:520px;
    background:radial-gradient(circle, rgba(245,166,35,0.14), rgba(245,166,35,0) 70%);
    pointer-events:none;
  }

  .panel{
    position:relative;
    z-index:1;
    width:100%;
    max-width:408px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
    background-color:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:2px;
    padding:52px 36px 40px;
    text-align:center;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.7);
  }

  /* signature: corner brackets lifted from the wordmark's own tagline frame */
  .bracket{
    position:absolute;
    width:22px;
    height:22px;
    border-color:var(--orange);
    opacity:0.85;
    transition: all 0.5s cubic-bezier(.2,.8,.2,1);
  }
  .bracket-tl{ top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; }
  .bracket-tr{ top:-1px; right:-1px; border-top:2px solid; border-right:2px solid; }
  .bracket-bl{ bottom:-1px; left:-1px; border-bottom:2px solid; border-left:2px solid; }
  .bracket-br{ bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; }

  .panel.unlocked .bracket{
    width:30px;
    height:30px;
    opacity:1;
  }

  .logo{
    width:118px;
    height:auto;
    display:block;
    margin:0 auto 22px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--orange);
    margin:0 0 28px;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    line-height:1.2;
    color:var(--white);
    margin:0 0 12px;
  }

  .sub{
    font-size:14.5px;
    line-height:1.55;
    color:var(--muted);
    margin:0 0 28px;
  }

  .field-label{
    display:block;
    text-align:left;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }

  input#code{
    width:100%;
    background:rgba(0,0,0,0.28);
    border:1px solid var(--panel-line);
    border-radius:1px;
    color:var(--cream);
    font-family:'JetBrains Mono', monospace;
    font-size:18px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    text-align:center;
    padding:14px 12px;
    outline:none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  input#code::placeholder{
    color: rgba(245,241,234,0.25);
    letter-spacing:0.32em;
  }

  input#code:focus-visible{
    border-color:var(--orange);
    box-shadow: 0 0 0 3px rgba(245,166,35,0.22);
  }

  button{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    border:none;
    border-radius:1px;
    cursor:pointer;
  }

  #submitBtn{
    width:100%;
    margin-top:14px;
    padding:14px 12px;
    background:var(--orange);
    color:#161513;
    transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
  }

  #submitBtn:hover:not(:disabled){ background:#ffb640; }
  #submitBtn:active:not(:disabled){ transform: translateY(1px); }
  #submitBtn:disabled{ opacity:0.6; cursor:default; }
  #submitBtn:focus-visible{ outline:2px solid var(--cream); outline-offset:2px; }

  .status{
    min-height:18px;
    font-size:13px;
    color:var(--error);
    margin:14px 0 0;
  }

  .btn-open{
    display:inline-block;
    margin-top:6px;
    padding:14px 28px;
    background:var(--orange);
    color:#161513;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    text-decoration:none;
    border-radius:1px;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .btn-open:hover{ background:#ffb640; }
  .btn-open:focus-visible{ outline:2px solid var(--cream); outline-offset:2px; }

  /* checkpoint scan sweep, plays once per submit */
  .panel.scanning::after{
    content:"";
    position:absolute;
    left:0; right:0;
    top:0;
    height:2px;
    background: linear-gradient(90deg, transparent, var(--orange), transparent);
    animation: sweep 0.65s ease-in-out;
  }
  @keyframes sweep{
    from{ top:0; opacity:0; }
    15%{ opacity:1; }
    to{ top:100%; opacity:0; }
  }

  .panel.shake{ animation: shake 0.4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }

  .foot{
    position:relative;
    z-index:1;
    margin-top:22px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color: rgba(245,241,234,0.32);
  }

  @media (prefers-reduced-motion: reduce){
    .bracket, #submitBtn, .btn-open{ transition:none; }
    .panel.scanning::after{ animation:none; display:none; }
    .panel.shake{ animation:none; }
  }

  @media (max-width:420px){
    .panel{ padding:44px 24px 32px; }
    h1{ font-size:22px; }
  }
</style>
</head>

      <div class="bracket bracket-bl"></div>
      <div class="bracket bracket-br"></div>

      <div id="gateView">
        <h1>Acceso al formulario</h1>
        <p class="sub">Este formulario es de acceso restringido.<br>Ingresa el código que recibiste para continuar.</p>

        <form id="codeForm" autocomplete="off">
          <label class="field-label" for="code">Código de acceso</label>
          <input id="code" name="code" type="text" placeholder="••••••••" autocapitalize="characters" spellcheck="false" maxlength="24">
          <button type="submit" id="submitBtn">Verificar código</button>
        </form>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>

      <div id="successView" hidden>
        <h1>Acceso verificado</h1>
        <p class="sub">Ya puedes abrir el formulario.</p>
        <a id="openForm" class="btn-open" href="#" target="_blank" rel="noopener">Abrir formulario ↗</a>
      </div>

  </div>

<script>
  // ── Configuración ──────────────────────────────────────────
  var ACCESS_CODE = "VIMEIS26";
  var FORM_URL = "https://forms.gle/zgt8N9nCy56TNVdU9";
  // ───────────────────────────────────────────────────────────

  var form = document.getElementById('codeForm');
  var input = document.getElementById('code');
  var status = document.getElementById('status');
  var panel = document.getElementById('panel');
  var gateView = document.getElementById('gateView');
  var successView = document.getElementById('successView');
  var openForm = document.getElementById('openForm');
  var submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var value = input.value.trim().toUpperCase();
    status.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Verificando…';
    panel.classList.remove('scanning');
    void panel.offsetWidth;
    panel.classList.add('scanning');

    setTimeout(function(){
      panel.classList.remove('scanning');
      if (value === ACCESS_CODE) {
        panel.classList.add('unlocked');
        openForm.href = FORM_URL;
        gateView.hidden = true;
        successView.hidden = false;
      } else {
        status.textContent = 'Código incorrecto. Revisa mayúsculas y vuelve a intentar.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Verificar código';
        panel.classList.add('shake');
        setTimeout(function(){ panel.classList.remove('shake'); }, 400);
      }
    }, 650);
  });
</script>
